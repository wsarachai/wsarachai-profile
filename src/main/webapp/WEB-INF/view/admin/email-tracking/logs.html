<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Email Tracking Logs</title>
    <link
      rel="stylesheet"
      href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css"
    />
  </head>
  <body>
    <div class="container mt-4">
      <h1>Email Tracking Logs</h1>

      <!-- Alert for messages -->
      <div
        class="alert alert-success"
        th:if="${message}"
        th:text="${message}"
      ></div>

      <!-- Action buttons -->
      <div class="mb-4">
        <a th:href="@{/}" class="btn btn-primary">
          <i class="fas fa-home"></i> Home
        </a>
      </div>

      <!-- Search form -->
      <div class="card mb-4">
        <div class="card-header">
          <h5>Search by Tracking ID</h5>
        </div>
        <div class="card-body">
          <form
            th:action="@{/admin/email-tracking/logs/by-id}"
            method="get"
            class="form-inline"
          >
            <div class="form-group mr-2">
              <input
                type="text"
                name="id"
                class="form-control"
                placeholder="Enter tracking ID"
              />
            </div>
            <button type="submit" class="btn btn-primary">Search</button>
          </form>
        </div>
      </div>

      <!-- Filter notice if filtering by tracking ID -->
      <div class="alert alert-info" th:if="${trackingId != null}">
        Showing results for tracking ID:
        <strong th:text="${trackingId}"></strong>
        <a
          th:href="@{/admin/email-tracking/logs}"
          class="btn btn-sm btn-outline-primary ml-2"
          >Clear Filter</a
        >

        <!-- Delete all logs for this tracking ID -->
        <form
          th:action="@{/admin/email-tracking/delete-by-tracking-id}"
          method="post"
          class="d-inline"
          onsubmit="return confirm('Are you sure you want to delete ALL logs for this tracking ID?');"
        >
          <input type="hidden" name="trackingId" th:value="${trackingId}" />
          <button type="submit" class="btn btn-sm btn-danger ml-2">
            Delete All Logs for this ID
          </button>
        </form>
      </div>

      <!-- Results table -->
      <div class="card">
        <div class="card-header">
          <h5>Tracking Results</h5>
        </div>
        <div class="card-body">
          <div th:if="${#lists.isEmpty(logs)}" class="alert alert-warning">
            No tracking logs found.
          </div>

          <table
            th:if="${not #lists.isEmpty(logs)}"
            class="table table-striped"
          >
            <thead>
              <tr>
                <th>ID</th>
                <th>Tracking ID</th>
                <th>Recipient Email</th>
                <th>IP Address</th>
                <th>User Agent</th>
                <th>Open Count</th>
                <th>Timestamp</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="log : ${logs}">
                <td th:text="${log.id}"></td>
                <td th:text="${log.trackingId}"></td>
                <td th:text="${log.recipientEmail}"></td>
                <td th:text="${log.ipAddress}"></td>
                <td>
                  <div
                    style="max-width: 300px; word-wrap: break-word"
                    th:text="${log.userAgent}"
                  ></div>
                </td>
                <td th:text="${log.openedCount}"></td>
                <td
                  th:text="${#dates.format(log.timestamp, 'yyyy-MM-dd HH:mm:ss')}"
                ></td>
                <td>
                  <form
                    th:action="@{/admin/email-tracking/delete}"
                    method="post"
                    class="d-inline"
                    onsubmit="return confirm('Are you sure you want to delete this tracking log?');"
                  >
                    <input type="hidden" name="id" th:value="${log.id}" />
                    <button type="submit" class="btn btn-sm btn-danger">
                      Delete
                    </button>
                  </form>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
  </body>
</html>
