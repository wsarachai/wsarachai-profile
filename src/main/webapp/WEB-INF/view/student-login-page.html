<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="stylesheet" th:href="@{/assets/css/main.css}">
    <title th:text="#{page.title}"></title>
</head>

<body>
    <header>
        <h1 th:text="#{page.title}"></h1>
    </header>
    <main id="main-container">
        <p class="title"><a th:href="@{'/'}">Home</a>&nbsp;&gt;&nbsp;<span th:text="#{page.student.login.title}"></span></p>
        <section class="flex-container-column">
            <div class="flex-container-row">
                <div class="item1">
                    <p>รายวิชา:</p>
                    <p>กลุ่ม</p>
                    <p>ปีการศึกษา</p>
                </div>
                <div class="item2">
                    <p th:text="${course.getSubject().getCode() + ' ' + course.getSubject().getThaiName()}"></p>
                    <p th:text="${courseSection.getGroupNumber()}"></p>
                    <p th:text="${course.getSemester()}"></p>
                </div>
            </div>
            <div class="blueTable outerTableFooter">
                <div class="tableFootStyle">
                    <div class="links">
<!--                        <a class="active" href="#">1</a>-->
                        <a th:each="i : ${#numbers.sequence(1, 15)}" th:text="${i}" th:href="@{'/student/atten/'+${courseId}+'/'+${secionId}+'/'+${i}}"></a>
                    </div>
                </div>
            </div>
            <div class="divTable blueTable">
                <div class="divTableHeading">
                    <div class="divTableRow">
                        <div class="divTableHead" th:text="#{page.student.login.no}"></div>
                        <div class="divTableHead" th:text="#{page.student.login.code}"></div>
                        <div class="divTableHead" th:text="#{page.student.login.name}"></div>
                        <div class="divTableHead" th:text="#{page.student.login.atten}"></div>
                        <div class="divTableHead" th:text="#{page.student.login.status}"></div>
                    </div>
                </div>
                <div class="divTableBody">
                    <div class="divTableRow" th:each="csReg, i : ${attenDatas}">
                        <div class="divTableCell" th:text="${i.index+1}"></div>
                        <div class="divTableCell" th:text="${csReg.getStudent().getStudentId()}"></div>
                        <div class="divTableCell" th:text="${csReg.getStudent().getPrename()+' '+csReg.getStudent().getFirstName()+' '+csReg.getStudent().getLastName()}"></div>
                        <div class="divTableCell">cell4_1</div>
                        <div class="divTableCell">cell5_1</div>
                    </div>
                </div>
            </div>
        </section>
    </main>
    <footer>
        <p>&copy; 2024 <span th:text="${teacher_name}"></span></p>
    </footer>
</body>

</html>
