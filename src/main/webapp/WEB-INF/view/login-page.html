<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="utf-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta name="mobile-web-app-capable" content="yes">
        <!-- Reference Bootstrap files -->
        <link rel="stylesheet" th:href="@{assets/css/bootstrap.min.css}">
        <title th:text="#{page.title}"></title>
    </head>
    <body>
        <div class="container">
            <div id="loginbox" style="margin-top: 50px;"
                 class="mainbox col-md-3 col-md-offset-4 col-sm-6 col-sm-offset-2">
                <div class="panel panel-info">
                    <div class="panel-heading">
                        <div class="panel-title">Sign In</div>
                    </div>
                    <div style="padding-top: 30px" class="panel-body">
                        <!-- Login Form -->
                        <form th:action="@{/authenticate}" th:method="post" class="form-horizontal">
                            <!-- Place for messages: error, alert etc ... -->
                            <div class="form-group">
                                <div class="col-xs-15">
                                    <div th:if="${param.error != null}"
                                         th:text="#{page.error.invalid-user}"
                                         class="alert alert-danger col-xs-offset-1 col-xs-10"></div>
                                    <div th:if="${param.logout != null}"
                                         th:text="#{page.login.already_loggedout}"
                                         class="alert alert-success col-xs-offset-1 col-xs-10"></div>
                                </div>
                            </div>
                            <!-- User name -->
                            <div style="margin-bottom: 25px" class="input-group">
                                <span class="input-group-addon"><i class="glyphicon glyphicon-user"></i></span>
                                <input type="text" name="username" class="form-control">
                            </div>
                            <!-- Password -->
                            <div style="margin-bottom: 25px" class="input-group">
                                <span class="input-group-addon"><i class="glyphicon glyphicon-lock"></i></span>
                                <input type="password" name="password" class="form-control">
                            </div>
                            <!-- Login/Submit Button -->
                            <div style="margin-top: 10px" class="form-group">
                                <div class="col-sm-6 controls">
                                    <button type="submit" class="btn btn-success" th:text="#{page.login}"></button>
                                </div>
                            </div>
                        </form>
                        <p>
<!--                            <a th:href="@{/register}" th:text="#{page.menu.register}"></a><br>-->
                            <a th:href="@{/}" th:text="#{page.back-to-home}"></a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
        <script th:src="@{assets/js/jquery-3.7.1.min.js}"></script>
        <script th:src="@{assets/js/bootstrap.min.js}"></script>
    </body>
</html>
