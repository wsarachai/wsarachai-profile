<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:include="layouts/general :: headerfiles"></head>
<body>
    <div th:replace="layouts/general :: header"></div>
    <main class="container course-container">
        <div class="my-4">
            <h4 th:text="#{page.student.import}"></h4>
            <a th:href="@{/}" th:text="#{page.navigate.back}"></a>
        </div>
        <div class="row">
            <div class="col-12 course-item">
                <div class="card">
                    <div class="course-header">
                        <p th:text="#{page.student.browse}"></p>
                    </div>
                    <div class="card-body">
                        <div class="flex-container-column">
                            <div class="flex-container-row">
                                <form id="uploadForm" method="post" th:action="@{/system/student/upload}" enctype="multipart/form-data"
                                      class="col-12 form-horizontal">
                                    <input id="input-file" type="file" name="file" style="display: none"/>
                                    <input type="button" id="choose_file_btn" th:value="#{page.student.choose_file}"/>
                                    <button class="btn btn-sm btn-danger float-right" type="submit">
                                        Upload
                                    </button>
                                    <label><input type="checkbox" name="read_header"/> Read header</label>
                                    <p id="file-info"></p>
                                </form>
                            </div>
                            <div class="flex-container-row">
                                <div th:if="${message != null}"
                                     class="alert alert-secondary alert-dismissible fade show text-center message mt-3"
                                     role="alert">
                                    [[${message}]]
                                    <button type="button" class="close btn-sm" data-dismiss="alert" aria-label="Close">
                                        <span aria-hidden="true">&times;</span>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <div th:replace="layouts/general.html :: footer"></div>
    <div th:replace="layouts/general.html :: scriptfiles"></div>
    <script th:src="@{/assets/js/file-upload.js}"></script>
</body>

</html>
