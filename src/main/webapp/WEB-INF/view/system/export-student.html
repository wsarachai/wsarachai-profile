<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
    <head th:insert="~{layouts/general :: headerfiles}"></head>
    <body>
        <header th:insert="~{layouts/general :: header}"></header>
        <main class="flex-container">
            <h2 th:text="#{page.student.login.title}"></h2>
            <div class="nav-div">
                <button onClick="history_back()" class="basic" th:text="#{page.navigate.back}"></button>
            </div>
            <section class="flex-container-column">
                <!-- Display course header of data table -->
                <div class="flex-container-row">
                    <div class="item1">
                        <p th:text="#{page.student.atten.subjects}">:</p>
                        <p th:text="#{page.student.atten.group}">:</p>
                        <p th:text="#{page.student.atten.semester}">:</p>
                    </div>
                    <!-- Display course header details of data table -->
                    <div class="item2">
                        <p th:text="${course.getSubject().getCode() + ' ' + course.getSubject().getThaiName()}"></p>
                        <p th:text="${section.getGroupNumber()}"></p>
                        <p th:text="${course.getSemester()}"></p>
                        <p>
                            <button id="btn-lec" class="info" th:text="#{page.student.atten.lec}"></button>
                            <button id="btn-lab" class="hide info" th:text="#{page.student.atten.lab}"></button>
                            <span>&nbsp;&nbsp;</span>
                            <a sec:authorize="hasAnyRole('ROLE_TEACHER','ROLE_ADMIN')"
                               th:href="@{'/system/student/atten/export/cvs/' + ${course.getId()} + '/' + ${section.getId()}}">
                                <span th:text="#{page.student.export}"></span>
                            </a>
                        </p>
                    </div>
                </div>
                <!-- End display course header of data table -->
                <!-- Display student attendance data table -->
                <div class="divTable blueTable">
                    <!-- Display Attendance header of data table -->
                    <div class="divTableHeading">
                        <div class="divTableRow">
                            <div class="divTableHead" th:text="#{page.no}"></div>
                            <div class="divTableHead" th:text="#{page.student.code}"></div>
                            <div class="divTableHead" th:text="#{page.user.firstname}"></div>
                            <div class="divTableHead" th:each="i : ${#numbers.sequence(0, 15)}" th:text="${i+1}"></div>
                        </div>
                    </div>
                    <!-- End display Attendance header of data table -->
                    <!-- Display attendance data table details -->
                    <div class="divTableBody">
                        <div class="divTableRow" th:each="csReg, i : ${attenDatas}">
                            <div class="divTableCell" th:text="${i.index+1}"></div>
                            <div class="divTableCell">
                                <span th:text="${csReg.getEnrollment().getStudent().getStudentId()}"></span>
                            </div>
                            <div class="divTableCell" th:text="${csReg.getEnrollment().getStudent().getPrename()+' '+csReg.getEnrollment().getStudent().getFirstName()+' '+csReg.getEnrollment().getStudent().getLastName()}"></div>
                            <div class="divTableCell"
                                 th:each="i : ${#numbers.sequence(0, 15)}">
                                <span class="img-lec" th:switch="${csReg.getAttenLec()[i].getStatus().name()}">
                                    <a th:case="'NA'" th:href="@{'/pub/student/view/'+${csReg.getEnrollment().getId()}+'/'+${csReg.getAttenLec()[i].getId()}}"><img th:src="@{/assets/images/na.png}"/></a>
                                    <a th:case="'ABSENT'" th:href="@{'/pub/student/view/'+${csReg.getEnrollment().getId()}+'/'+${csReg.getAttenLec()[i].getId()}}"><img th:src="@{/assets/images/absent.png}"/></a>
                                    <a th:case="'LATE'" th:href="@{'/pub/student/view/'+${csReg.getEnrollment().getId()}+'/'+${csReg.getAttenLec()[i].getId()}}"><img th:src="@{/assets/images/late.png}"/></a>
                                    <a th:case="'LETTERS'" th:href="@{'/pub/student/view/'+${csReg.getEnrollment().getId()}+'/'+${csReg.getAttenLec()[i].getId()}}"><img th:src="@{/assets/images/letters.png}"/></a>
                                    <a th:case="'ATTENDED'" th:href="@{'/pub/student/view/'+${csReg.getEnrollment().getId()}+'/'+${csReg.getAttenLec()[i].getId()}}"><img th:src="@{/assets/images/atten.png}"/></a>
                                    <p th:case="*" th:text="${csReg.getAttenLec()[i].getStatus().name()}"></p>
                                </span>
                                <span class="img-lab hide" th:switch="${csReg.getAttenLab()[i].getStatus().name()}">
                                    <a th:case="'NA'" th:href="@{'/pub/student/view/'+${csReg.getEnrollment().getId()}+'/'+${csReg.getAttenLab()[i].getId()}}"><img th:src="@{/assets/images/na.png}"/></a>
                                    <a th:case="'ABSENT'" th:href="@{'/pub/student/view/'+${csReg.getEnrollment().getId()}+'/'+${csReg.getAttenLab()[i].getId()}}"><img th:src="@{/assets/images/absent.png}"/></a>
                                    <a th:case="'LATE'" th:href="@{'/pub/student/view/'+${csReg.getEnrollment().getId()}+'/'+${csReg.getAttenLab()[i].getId()}}"><img th:src="@{/assets/images/late.png}"/></a>
                                    <a th:case="'LETTERS'" th:href="@{'/pub/student/view/'+${csReg.getEnrollment().getId()}+'/'+${csReg.getAttenLab()[i].getId()}}"><img th:src="@{/assets/images/letters.png}"/></a>
                                    <a th:case="'ATTENDED'" th:href="@{'/pub/student/view/'+${csReg.getEnrollment().getId()}+'/'+${csReg.getAttenLab()[i].getId()}}"><img th:src="@{/assets/images/atten.png}"/></a>
                                    <p th:case="*" th:text="${csReg.getAttenLab()[i].getStatus().name()}"></p>
                                </span>
                            </div>
                        </div>
                    </div>
                    <!-- End display attendance data table details -->
                </div>
                <!-- End display student attendance data table -->
            </section>
        </main>
        <footer class="fixed-footer" th:insert="~{layouts/general.html :: footer}"></footer>
        <script type='text/javascript' th:replace="~{layouts/general.html :: scriptfiles}"></script>
        <script th:src="@{'/assets/js/atten.js'}" sec:authorize="hasRole('ROLE_TEACHER')"></script>
    </body>

</html>
