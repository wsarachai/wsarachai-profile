<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:insert="~{layouts/general :: headerfiles}"></head>
<body>
    <header th:insert="~{layouts/general :: header}"></header>
    <main class="flex-container">
        <div>
            <h2 th:text="#{page.menu.register}"></h2>
            <a class="nav-div" th:href="@{/system/student/import}" th:text="#{page.navigate.back}"></a>
        </div>
        <div class="import-items-container">
            <section class="flex-container-column">
                <h3 th:text="#{page.student.import.select}"></h3>
                <form th:action="@{/system/student/enroll}" method="post">
                    <div  class="upload-form-container">
                        <div class="field-group upload-form-item">
                            <label for="no" th:text="#{page.no}">:*</label>
                            <div>
                                <select class="basic" id="no" name="no">
                                    <option th:each="field, i : ${fields}" th:value="${i.index}" th:text="${field}"></option>
                                </select>
                            </div>
                        </div>
                        <div class="field-group upload-form-item">
                            <label for="code" th:text="#{page.student.code}">:*</label>
                            <div>
                                <select class="basic" id="code" name="code">
                                    <option th:each="field, i : ${fields}" th:value="${i.index}" th:text="${field}"></option>
                                </select>
                            </div>
                        </div>
                        <div class="field-group upload-form-item">
                            <label for="prename" th:text="#{page.user.prename}">:*</label>
                            <div>
                                <select class="basic" id="prename" name="prename">
                                    <option th:each="field, i : ${fields}" th:value="${i.index}" th:text="${field}"></option>
                                </select>
                            </div>
                        </div>
                        <div class="field-group upload-form-item">
                            <label for="firstname" th:text="#{page.user.firstname}">:*</label>
                            <div>
                                <select class="basic" id="firstname" name="firstname">
                                    <option th:each="field, i : ${fields}" th:value="${i.index}" th:text="${field}"></option>
                                </select>
                            </div>
                        </div>
                        <div class="field-group upload-form-item">
                            <label for="lastname" th:text="#{page.user.lastname}">:*</label>
                            <div>
                                <select class="basic" id="lastname" name="lastname">
                                    <option th:each="field, i : ${fields}" th:value="${i.index}" th:text="${field}"></option>
                                </select>
                            </div>
                        </div>
                        <div class="field-group upload-form-item">
                            <label for="section_id" th:text="#{page.menu.register}">:*</label>
                            <div>
                                <select class="basic" id="section_id" name="section_id">
                                    <option th:each="sec : ${sections}" th:value="${sec.getId()}" th:text="${sec.getCourse().getSubject().getCode()+'-sec'+sec.getGroupNumber()}"></option>
                                </select>
                            </div>
                        </div>
                        <div class="field-group upload-form-btn">
                            <button class="basic" type="submit" th:text="#{page.student.import.btn}"/>
                        </div>
                    </div>
                </form>
                <div class="divTable blueTable">
                    <div class="divTableHeading">
                        <div class="divTableRow">
                            <div class="divTableHead" th:each="field : ${fields}" th:text="${field}"></div>
                        </div>
                    </div>
                    <div class="divTableBody">
                        <div class="divTableRow" th:each="lst : ${records}">
                            <div class="divTableCell" th:each="data : ${lst}" th:text="${data}"></div>
                        </div>
                    </div>
                </div>
            </section>
        </div>
    </main>
    <footer class="fixed-footer" th:insert="~{layouts/general.html :: footer}"></footer>
    <script type='text/javascript' th:replace="~{layouts/general.html :: scriptfiles}"></script>
</body>

</html>
