<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:include="layouts/general :: headerfiles"></head>
<body>
<div th:replace="layouts/general :: header"></div>
    <main class="container course-container">
        <div class="my-4">
            <h4><i class="fas fa-sign-in-alt"></i> <span th:text="#{page.home.settings.changepassword}"></span></h4>
        </div>
        <div class="row">
            <section style="margin-top: 50px;" class="col-12 flex-container-column">
                <div class="form-container">
                    <!-- Place for messages: error, alert etc ... -->
                    <div class="form-group" id="errorMessageGroup">
                        <div class="col-xs-15">
                            <div class="alert alert-danger col-xs-offset-1 col-xs-10">
                                <span id="errorMessage"></span>
                            </div>
                        </div>
                    </div>
                    <!-- Login Form -->
                    <form th:action="@{/member/change-password}"
                          th:object="${member}"
                          th:method="post">
                        <!-- User info -->
                        <div class="form-group">
                            <input type="hidden" th:field="*{id}">
                            <span th:text="${member.getPrename()+member.getFirstName()+' '+member.getLastName()}"></span>
                        </div>
                        <!-- User name -->
                        <div class="form-group">
                            <label th:for="${#ids.next('username')}" th:text="#{bean.user.username}"></label>
                            <input type="text" th:field="*{username}" disabled="disabled">
                        </div>
                        <!-- Password -->
                        <div class="form-group">
                            <label th:for="${#ids.next('password')}" th:text="#{bean.user.password}"></label>
                            <input type="password" th:field="*{password}" required>
                        </div>
                        <!-- New password -->
                        <div class="form-group">
                            <label th:for="${#ids.next('newPassword')}" th:text="#{bean.user.newpassword}"></label>
                            <input type="password" th:field="*{newPassword}">
                        </div>
                        <!-- Confirm password -->
                        <div class="form-group">
                            <label for="passwordconfirm" th:text="#{bean.user.passwordconfirm}"></label>
                            <input type="password" id="passwordconfirm">
                        </div>
                        <!-- Login/Submit Button -->
                        <button type="submit" class="btn btn-success" th:text="#{page.btn.save}"></button>
                    </form>
                </div>
            </section>
        </div>
    </main>
    <div th:replace="layouts/general.html :: footer"></div>
    <div th:replace="layouts/general.html :: scriptfiles"></div>
    <script type='text/javascript' th:src="@{'/assets/js/change-password.js'}"></script>
</body>
</html>
