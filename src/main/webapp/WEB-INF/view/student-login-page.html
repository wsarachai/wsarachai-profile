<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="stylesheet" th:href="@{/assets/css/main.css}">
    <title th:text="#{page.title}"></title>
</head>

<body>
    <header>
        <h1 th:text="#{page.title}"></h1>
    </header>
    <main id="main-container">
        <p><span class="title" th:text="#{page.student.login.title}"></span></p>
        <section class="flex-container-column">
            <div class="flex-container-row">
                <div class="item1">
                    <p>รายวิชา:</p>
                    <p>กลุ่ม</p>
                    <p>ปีการศึกษา</p>
                </div>
                <div class="item2">
                    <p th:text="${course.getSubject().getCode() + ' ' + course.getSubject().getThaiName()}"></p>
                    <p th:text="${courseSection.getGroupNumber()}"></p>
                    <p th:text="${course.getSemester()}"></p>
                </div>
            </div>
            <div class="blueTable outerTableFooter"><div class="tableFootStyle"><div class="links"><a href="#">&laquo;</a> <a class="active" href="#">1</a> <a href="#">2</a> <a href="#">3</a> <a href="#">4</a> <a href="#">&raquo;</a></div></div></div>
            <div class="divTable blueTable">
                <div class="divTableHeading">
                    <div class="divTableRow">
                        <div class="divTableHead" th:text="#{page.student.login.no}"></div>
                        <div class="divTableHead" th:text="#{page.student.login.code}"></div>
                        <div class="divTableHead" th:text="#{page.student.login.name}"></div>
                        <div class="divTableHead" th:text="#{page.student.login.atten}"></div>
                        <div class="divTableHead" th:text="#{page.student.login.status}"></div>
                    </div>
                </div>
                <div class="divTableBody">
                    <div class="divTableRow" th:each="csReg, i : ${courseSectionRegistrations}">
                        <div class="divTableCell" th:text="${i}"></div>
                        <div class="divTableCell" th:text="${csReg.getStudent().getStudentId()}"></div>
                        <div class="divTableCell" th:text="${csReg.getStudent().getPrename()+' '+csReg.getStudent().getFirstName()+' '+csReg.getStudent().getLastName()}"></div>
                        <div class="divTableCell">cell4_1</div>
                        <div class="divTableCell">cell5_1</div>
                    </div>
                    <div class="divTableRow">
                        <div class="divTableCell">cell1_2</div><div class="divTableCell">cell2_2</div><div class="divTableCell">cell3_2</div><div class="divTableCell">cell4_2</div><div class="divTableCell">cell5_2</div>
                    </div>
                    <div class="divTableRow">
                        <div class="divTableCell">cell1_3</div><div class="divTableCell">cell2_3</div><div class="divTableCell">cell3_3</div><div class="divTableCell">cell4_3</div><div class="divTableCell">cell5_3</div>
                    </div>
                    <div class="divTableRow">
                        <div class="divTableCell">cell1_4</div><div class="divTableCell">cell2_4</div><div class="divTableCell">cell3_4</div><div class="divTableCell">cell4_4</div><div class="divTableCell">cell5_4</div>
                    </div>
                </div>
            </div>
        </section>
    </main>
    <footer>
        <p>&copy; 2024 <span th:text="${teacher_name}"></span></p>
    </footer>
</body>

</html>
