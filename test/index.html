<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="stylesheet" href="assets/css/main.css">
    <title th:text="${title}"></title>
</head>

<body>
    <header>
        <h1>สาขาเทคโนโลยีสารสนเทศ คณะวิทยาศาสตร์ มหาวิทยาลัยแม่โจ้</h1>
    </header>
    <main id="main-container">
        <p class="title">รายวิชาที่สอน: <span class="person-name">อาจารย์ ดร.วัชรินทร์ สาระไชย</span></p>
        <section class="flex-container-column">
            <div class="flex-container-row">
                <div class="item1">
                    <p>รายวิชา:</p>
                    <p>กลุ่ม</p>
                    <p>ปีการศึกษา</p>
                    <p>Location</p>
                </div>
                <div class="item2">
                    <p>รายวิชา:</p>
                    <p>กลุ่ม</p>
                    <p>ปีการศึกษา</p>
                    <p id="location"></p>
                </div>
            </div>
            <div class="flex-container-row">
                <div class="item3">
                    <div class="wrapper">
                        <video></video>
                        <br />
                        <button id="newphoto" state1="ถ่ายรูปนักศึกษา" state2="ถ่ายรูปอ้างอิง">ถ่ายรูปนักศึกษา</button>
                    </div>
                </div>
                <div class="item4">
                    <div class="wrapper">
                        <canvas id="canvas1"></canvas>
                        <p>รูปนักศึกษา</p>
                    </div>
                    <div class="wrapper">
                        <canvas id="canvas2"></canvas>
                        <p>รูปอ้างอิง</p>
                    </div>
                </div>
            </div>
            <div class="flex-container-row">
                <div class="item5">
                    <button id="attbutton" disabled="disabled">ลงชื่อเข้าเรียน</button>
                </div>
            </div>
            <p id="currentDate"></p>
            <p id="currentTime"></p>
        </section>
    </main>
    <footer>
        <p>&copy; 2024 อาจารย์ ดร.วัชริทร์ สาระไชย</p>
    </footer>
    <script src="assets/js/main.js"></script>
</body>

</html>
