<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:insert="~{layouts/general :: headerfiles}"></head>
<body>
    <header th:insert="~{layouts/general :: header}"></header>
    <main class="flex-container"></div>
        <h2><i class="fa-solid fa-key"></i> <span th:text="#{page.user.profile}"></span></h2>
        <div class="nav-div">
            <button onClick="history_back()" class="basic" th:text="#{page.navigate.back}"></button>
        </div>
        <section class="flex-container-column">
            <div class="form-container">
                <form th:action="@{/member/profile}" th:object="${member}" th:method="post">
                    <div th:if="${studentId}" class="form-group">
                        <label th:for="${#ids.next('studentId')}" th:text="#{page.student.code}"></label>
                        <input type="text" th:value="${studentId}" readonly="readonly">
                    </div>
                    <div class="form-group">
                        <label th:for="${#ids.next('prename')}" th:text="#{page.user.prename}"></label>
                        <input type="text" th:field="*{prename}" readonly="readonly">
                    </div>
                    <div class="form-group">
                        <label th:for="${#ids.next('firstname')}" th:text="#{page.user.firstname}"></label>
                        <input type="text" th:field="*{firstName}" readonly="readonly">
                    </div>
                    <div class="form-group">
                        <label th:for="${#ids.next('lastname')}" th:text="#{page.user.lastname}"></label>
                        <input type="text" th:field="*{lastName}" readonly="readonly">
                    </div>
                    <!-- Login/Submit Button -->
                    <button type="submit" class="danger" th:text="#{page.btn.save}" disabled="disabled"></button>
                </form>
            </div>
        </section>
    </main>
    <footer class="fixed-footer" th:insert="~{layouts/general.html :: footer}"></footer>
    <script type='text/javascript' th:replace="~{layouts/general.html :: scriptfiles}"></script>
</body>
</html>
