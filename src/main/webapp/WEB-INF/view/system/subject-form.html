<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
    <head th:insert="~{layouts/general :: headerfiles}"></head>
    <body>
        <header th:insert="~{layouts/general :: header}"></header>
        <!-- Main content -->
        <main class="flex-container">
            <h2><i class="fa-solid fa-graduation-cap"></i> <span th:text="#{page.home.title}"></span></h2>
            <input type="text" id="searchInput" onkeyup="filterCourses()" th:placeholder="#{page.home.search.courses}+'...'" class="form-control-inline mb-4">
            <button class="add-new" th:text="#{page.btn.add}"></button>

            <!-- Main content -->
            <div id="subject-mgr-container" class="main-body-container">
                <div class="card" th:each="subject : ${subjects}">
                    <div class="card-header">
                        <span  th:text="${subject.getCode()}"/> <span  th:text="${subject.getThaiName()}"/>
                    </div>
                    <div class="card-body">
                        <section th:id="${'subject-'+subject.getId()+'-section'}" class="flex-container-column hide">
                            <div class="form-container">
                                <form th:id="${'subject-'+subject.getId()+'-form'}">
                                    <input type="hidden" name="id" th:value="${subject.getId()}">
                                    <div class="form-group">
                                        <label>
                                            Code: <input type="text" name="code" th:value="${subject.getCode()}">
                                        </label>
                                    </div>
                                    <div class="form-group">
                                        <label>
                                            Type: <input type="text" name="type" th:value="${subject.getType()}">
                                        </label>
                                    </div>
                                    <div class="form-group">
                                        <label>
                                            Thai Name: <input type="text" name="thaiName" th:value="${subject.getThaiName()}">
                                        </label>
                                    </div>
                                    <div class="form-group">
                                        <label>
                                            Eng Name: <input type="text" name="engName" th:value="${subject.getEngName()}">
                                        </label>
                                    </div>
                                    <div class="form-group">
                                        <label>
                                            Credit: <input type="number" name="credit" th:value="${subject.getCredit()}">
                                        </label>
                                    </div>
                                    <div class="form-group">
                                        <label>
                                            Credit detail: <input type="text" name="creditDetail" th:value="${subject.getCreditDetail()}">
                                        </label>
                                    </div>
                                    <div class="form-group">
                                        <label>
                                            Curriculum: <select name="curriculum">
                                            <option th:each="curr : ${curriculums}"
                                                    th:value="${curr.getId()}"
                                                    th:text="${curr.getYear()}"
                                                    th:selected="(${curr.getId()}==${subject.getCurriculum().getId()})"></option>
                                        </select>
                                        </label>
                                    </div>
                                    <div class="form-group">
                                        <label>
                                            Description: <textarea name="description" rows="3" th:text="${subject.getDescription()}"></textarea>
                                        </label>
                                    </div>
                                    <!-- Login/Submit Button -->
                                    <button th:data-id="${subject.getId()}" class="frm-save info" th:text="#{page.btn.save}"></button>
                                    <button th:data-id="${subject.getId()}" class="frm-cancel danger" th:text="#{page.btn.cancel}"></button>
                                </form>
                            </div>
                        </section>

                        <section th:id="${'subject-'+subject.getId()+'-detail'}">
                            <p th:text="${subject.getDescription()}"></p>
                            <button class="edit" th:id="${'subject-'+subject.getId()+'-btn'}" th:data-id="${subject.getId()}">Edit</button>
                        </section>
                    </div>
                </div>
            </div>
            <!-- End of main content -->
        </main>
        <!-- End of main content -->
        <footer class="fixed-footer" th:insert="~{layouts/general.html :: footer}"></footer>
        <script type='text/javascript' th:replace="~{layouts/general.html :: scriptfiles}"></script>
        <script th:src="@{'/assets/js/subject-mgr.js'}"></script>
    </body>
</html>
