<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:insert="~{layouts/general :: headerfiles}"></head>
<body>
<header th:insert="~{layouts/general :: header}"></header>
    <main class="flex-container">
        <h2 th:text="#{page.student.title}"></h2>
        <section class="course-item">
            <div class="divTable blueTable">
                <div class="divTableHeading">
                    <div class="divTableRow">
                        <div class="divTableHead" th:text="#{page.no}"></div>
                        <div class="divTableHead" th:text="#{page.student.code}"></div>
                        <div class="divTableHead" th:text="#{page.user.prename}"></div>
                        <div class="divTableHead" th:text="#{page.user.firstname}"></div>
                        <div class="divTableHead" th:text="#{page.user.lastname}"></div>
                        <div class="divTableHead" th:text="#{page.student.atten.subjects}"></div>
                    </div>
                </div>
                <div class="divTableBody">
                    <div class="divTableRow" th:each="stu, i : ${students}">
                        <div class="divTableCell" th:text="${i.index+1}"></div>
                        <div class="divTableCell" th:text="${stu.getStudentId()}"></div>
                        <div class="divTableCell" th:text="${stu.getPrename()}"></div>
                        <div class="divTableCell" th:text="${stu.getFirstName()}"></div>
                        <div class="divTableCell" th:text="${stu.getLastName()}"></div>
                        <div class="divTableCell">xxx</div>
                    </div>
                </div>
            </div>
        </section>
    </main>
<footer class="fixed-footer" th:insert="~{layouts/general.html :: footer}"></footer>
<script type='text/javascript' th:replace="~{layouts/general.html :: scriptfiles}"></script>
<script th:src="@{/assets/js/take-picture.js}"></script>
</body>

</html>
