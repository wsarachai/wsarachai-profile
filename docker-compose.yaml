services:
  # MySQL Database Service
  mysql:
    image: mysql:8.0
    container_name: wsarachai-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: 1234
      MYSQL_DATABASE: wsarachai_db
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - wsarachai-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # Tomcat Application Server
  tomcat:
    image: tomcat:9.0-jdk17
    container_name: wsarachai-tomcat
    restart: always
    ports:
      - "8080:8080"
      - "8000:8000"
    volumes:
      - ./target/wsarachai.war:/usr/local/tomcat/webapps/wsarachai.war
    # Environment variables for Tomcat
    environment:
      # bind JPDA to all interfaces so host debugger can attach
      JPDA_ADDRESS: "0.0.0.0:8000"
      JPDA_TRANSPORT: "dt_socket"
      # suspend JVM until debugger attaches (useful for diagnosing attach issues)
      JPDA_SUSPEND: "y"
      CATALINA_OPTS: "-Dspring.profiles.active=docker -Xmx512m -Xms256m"
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: wsarachai_db
      DB_USER: root
      DB_PASSWORD: 1234
      # Enable development populate endpoint inside container when set to true
      DEV_POPULATE: "true"
    entrypoint: ["catalina.sh", "jpda", "run"]
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - wsarachai-network

  # phpMyAdmin for Database Management (Optional)
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: wsarachai-phpmyadmin
    restart: always
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: 1234
      MYSQL_ROOT_PASSWORD: 1234
    ports:
      - "8081:80"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - wsarachai-network

# Named volumes
volumes:
  mysql_data:
    driver: local

# Networks
networks:
  wsarachai-network:
    driver: bridge
